<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.json"><title>Nosuggest Viewer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#fff;color:#202124}#splash{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:1000}#splash img{width:100%;height:100%;object-fit:cover}#app{position:fixed;inset:0;display:none;background:#fff}iframe{width:100%;height:100%;border:0;display:block}.shade{position:fixed;inset:0;background:rgba(255,255,255,.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:2000}.box{width:min(420px,100%);background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;padding:30px;box-shadow:0 12px 45px rgba(0,0,0,.18);animation:in .22s ease}.box.large{width:min(520px,100%)}h1{font-size:24px;margin:0 0 12px;font-weight:600}p{font-size:15px;line-height:1.5;color:#5f6368;margin:0 0 24px}.buttons{display:flex;gap:10px;justify-content:flex-end}.btn{border:0;border-radius:22px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;background:#f1f3f4;color:#202124}.btn.primary{background:#1a73e8;color:#fff}.field{margin:0 0 16px}.field label{display:block;font-size:13px;color:#5f6368;margin:0 0 7px}.field input{width:100%;height:48px;border:1px solid #dadce0;border-radius:14px;padding:0 15px;font-size:15px;outline:none}.field input:focus{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.12)}.status{text-align:center;font-size:20px;font-weight:600;line-height:1.4;color:#202124}.status p{margin-top:10px}@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}@media(max-width:480px){.box{padding:24px;border-radius:24px}.buttons{flex-direction:column-reverse}.btn{width:100%}}</style></head><body><div id="splash"><img src="images2.png" alt=""></div><main id="app"><iframe id="frame" src="about:blank" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></main><div id="dialog" class="shade" style="display:none"><div class="box"><h1>Application Crashed.</h1><p>Please try again or contact us.</p><div class="buttons"><button class="btn" onclick="contact()">Contact us</button><button class="btn primary" onclick="retry()">Try again</button></div></div></div><script>const LOCAL_CODE="Code001Code";const splash=document.getElementById("splash"),app=document.getElementById("app"),dialog=document.getElementById("dialog"),frame=document.getElementById("frame");setTimeout(()=>{splash.style.display="none";dialog.style.display="flex"},4000);function retry(){try{window.close()}catch(e){}location.replace(location.href)}function contact(){dialog.innerHTML='<div class="box large"><h1>Contact Us</h1><div class="field"><label>Please enter phone number:</label><input id="a99" type="text" autocomplete="off"></div><div class="field"><label>Please enter what problem there is:</label><input id="b99" type="text" autocomplete="off"></div><div class="buttons"><button class="btn primary" onclick="enter()">Enter</button></div></div>'}function enter(){const a=document.getElementById("a99").value,b=document.getElementById("b99").value;if(a===LOCAL_CODE&&b===LOCAL_CODE){dialog.style.display="none";app.style.display="block";frame.src="https://nosuggest.com"}else{dialog.innerHTML='<div class="box"><div class="status">Message sent.<p>You will be notified about the situation soon.</p></div></div>';setTimeout(()=>{try{window.close()}catch(e){}location.replace(location.href)},10000)}}<\/script></body></html>
